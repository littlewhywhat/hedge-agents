x-node: &node
  build: .
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

x-env: &env
  DATABASE_URL: postgresql://hedge:hedge@postgres:5432/hedge
  BROKER_URL: ws://broker:8090
  AGENT_URL_BTC: ws://btc:8081
  AGENT_URL_ETH: ws://eth:8082
  AGENT_URL_SPX: ws://spx:8083
  AGENT_URL_GOLD: ws://gold:8084

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hedge
      POSTGRES_PASSWORD: hedge
      POSTGRES_DB: hedge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hedge -d hedge"]
      interval: 2s
      timeout: 5s
      retries: 20

  broker:
    <<: *node
    environment:
      <<: *env
      PROCESS: broker
    ports:
      - "8090:8090"

  btc:
    <<: *node
    environment:
      <<: *env
      PROCESS: agent
      ASSET: btc
    ports:
      - "8081:8081"

  eth:
    <<: *node
    environment:
      <<: *env
      PROCESS: agent
      ASSET: eth
    ports:
      - "8082:8082"

  spx:
    <<: *node
    environment:
      <<: *env
      PROCESS: agent
      ASSET: spx
    ports:
      - "8083:8083"

  gold:
    <<: *node
    environment:
      <<: *env
      PROCESS: agent
      ASSET: gold
    ports:
      - "8084:8084"

  manager:
    <<: *node
    environment:
      <<: *env
      PROCESS: manager
    ports:
      - "8080:8080"

volumes:
  pgdata:
