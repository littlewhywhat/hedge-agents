[project]
name = "hedge-agents"
version = "0.1.0"
description = "One-operator Masumi fund, durable settlement, and isolated paper replay"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0.38,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "rfc8785>=0.1.4,<1",
  "solders>=0.26,<1",
  "solana>=0.36,<1",
  "masumi==1.2.0",
  "cbor2<6",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]
ops = [
    "podman-compose>=1.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
